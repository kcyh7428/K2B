[project]
name = "esales-crm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "reportlab>=4,<6", "xlrd>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "pypdf>=5,<7", "aiosmtpd>=1.4,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
